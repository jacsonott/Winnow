[pytest]
testpaths = tests
# A test still running after five minutes is hung, not slow (whole CI
# shards take under five): print every thread's stack so the log shows
# where. It does not stop the test; ci.yml's timeout-minutes does that.
faulthandler_timeout = 300
markers =
    ui: browser-driven test — needs playwright + chromium (see tests/ui/conftest.py)
