# Builds docs/wiki/ into the GitHub Pages site and deploys it.
#
# The site is the manual for the released version, so it is built from
# main, which only moves at a release. docs/wiki/ keeps changing on
# develop in the same pull requests as the behaviour it describes; the
# GitHub wiki (wiki.yml) follows develop and shows that, and the site
# catches up when the release does. "Edit this page" on the site still
# opens develop, because that is where a docs pull request goes.
#
# scripts/build_wiki.py --site turns the pages into MkDocs' input (nav
# from Home.md's page list, links to the rest of the repository pointing
# at main), and docs/site/mkdocs.yml is the theme. Pull requests build the
# site without deploying it, with --strict, so a dead link or anchor
# fails here rather than on the published site.
#
# Pages has to be switched on once, in the repository's Settings → Pages,
# with "Source: GitHub Actions". Until then the deploy job fails and says
# so; the build job is unaffected. The site's domain, winnow.jacson.tech,
# is set on the same page under "Custom domain", not by a CNAME file: a
# site deployed by Actions ignores one. build_wiki.py's SITE_DOMAINS has
# to name the same domain.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]
    paths:
      - "docs/wiki/**"
      - "docs/writing-plugins.md"
      - "docs/screenshots/**"
      - "docs/site/**"
      - "static/icons/**"
      - "scripts/build_wiki.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

# Deploys go one at a time, in order; a newer push to a pull request makes
# its previous build irrelevant.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Material prints a banner about MkDocs 2.0 on every build. It doesn't
  # apply: docs/site/requirements.txt pins MkDocs 1.x.
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/site/requirements.txt
      - run: pip install -r docs/site/requirements.txt
      - name: Stage the pages
        run: python scripts/build_wiki.py --site "$RUNNER_TEMP/site" --repo "$GITHUB_REPOSITORY" --ref main --edit-ref develop
      - name: Build
        run: mkdocs build --strict -f "$RUNNER_TEMP/site/mkdocs.yml"
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site/site

  deploy:
    name: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
